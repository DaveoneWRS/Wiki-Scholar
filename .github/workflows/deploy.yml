name: Deploy Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # Der Server ist von den GitHub-Runnern aus nicht per SSH erreichbar
      # (Port 22 gefiltert). Statt zu pushen, legen wir das fertige Ergebnis
      # im Branch "deploy" ab; ein cron-Job auf dem Server holt es sich dort ab.
      - name: In deploy-Branch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy von ${GITHUB_SHA} (Run ${GITHUB_RUN_NUMBER})"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
